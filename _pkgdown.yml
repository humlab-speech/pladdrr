url: https://humlab-speech.github.io/pladdrr

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#0054a6"
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto Slab"}
    code_font: {google: "JetBrains Mono"}

home:
  title: "pladdrr: Direct Access to Praat C Functionality from R"
  description: |
    High-performance phonetic analysis in R with direct C++ access to Praat.
    38 Rcpp modules, SIMD optimization, zero-copy operations.
  
  links:
  - text: Browse source code
    href: https://github.com/humlab-speech/pladdrr

