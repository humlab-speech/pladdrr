# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        run: sudo apt-get install -y libgsl-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::Rcpp
            any::RcppXsimd
            any::R6
            any::rlang
            any::data.table
            any::ggplot2
            local::.
          needs: website

      - name: Build site
        run: |
          # Work around r-lib/pkgdown bug: navbar_links_haystack() returns NULL
          # (not a 0-row tibble) when a page's navbar has zero matching
          # nav-items, which crashes activate_navbar()'s
          # haystack[haystack$similar > 0, ] with "incorrect number of
          # dimensions". activate_navbar() already handles nrow(haystack)==0
          # fine, so this only restores that guarantee.
          orig <- pkgdown:::navbar_links_haystack
          patched <- function(html, pkg, path) {
            out <- orig(html, pkg, path)
            if (is.null(out) || !is.data.frame(out)) {
              return(tibble::tibble(nav_item = list(), links = character(), similar = numeric()))
            }
            out
          }
          assignInNamespace("navbar_links_haystack", patched, ns = "pkgdown")
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
