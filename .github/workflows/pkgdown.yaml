# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
    tags: ['*']
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        run: sudo apt-get install -y libgsl-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::Rcpp
            any::RcppXsimd
            any::R6
            any::rlang
            any::data.table
            any::ggplot2
            local::.
          needs: website

      - name: Build site
        run: |
          # Work around r-lib/pkgdown bug: when a page's navbar has zero
          # matching nav-items, navbar_links_haystack()'s
          # `do.call(rbind, lapply(nav_items, ...))` returns NULL, and the
          # following `haystack$similar <- ...` turns that NULL into a plain
          # list (not a data.frame). The function's own final
          # `haystack[haystack$similar > 0, ]` then crashes with "incorrect
          # number of dimensions" *inside* navbar_links_haystack itself, so
          # wrapping it and inspecting its return value (the previous fix)
          # never runs - the error fires before orig() returns. Catch the
          # error instead.
          orig <- pkgdown:::navbar_links_haystack
          patched <- function(html, pkg, path) {
            tryCatch(
              orig(html, pkg, path),
              error = function(e) {
                tibble::tibble(nav_item = list(), links = character(), similar = numeric())
              }
            )
          }
          assignInNamespace("navbar_links_haystack", patched, ns = "pkgdown")
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
