name: pkgcheck

# This will cancel running jobs once a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  # Manually trigger the Action under Actions/pkgcheck
  workflow_dispatch:
  # Run on every push to main
  push:
    branches:
      - main

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      # r-lib/actions/setup-r sets this for other workflows, but
      # pkgcheck-action's own docker step doesn't - without it,
      # testthat::skip_on_cran() tests are silently skipped during the
      # action's internal covr coverage run, undercounting coverage.
      NOT_CRAN: "true"
      # Count the extended tests in the coverage figure.
      PLADDRR_EXTENDED_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pkgcheck-action's docker step runs as root, but the workspace is
      # owned by the runner user, so libgit2 refuses to open it ("dubious
      # ownership") unless safe.directory is set in the container's HOME
      # (/github/home). A host-side `git config --global` doesn't reach
      # that path, so trust it from inside a container instead.
      - uses: docker://alpine/git
        with:
          args: config --global --add safe.directory /github/workspace

      # pkgcheck enforces rOpenSci review-level bars (e.g. any R CMD check
      # WARNING fails it), and two of ours are permanent per cran-comments.md
      # (-ffp-contract=off for bit-exact Praat parity; justified vendored
      # stderr/stdout/_exit symbols) - not CRAN blockers. The action itself
      # must therefore stay non-blocking; the "Gate pkgcheck failures" step
      # below re-imposes the gate content-exactly for every *other* failure,
      # so a regression can never be silently absorbed by this
      # continue-on-error (the previous state: the run went green while
      # pkgcheck internally failed three checks).
      - uses: ropensci-review-tools/pkgcheck-action@main
        continue-on-error: true
        with:
          ref: ""
          # Refresh the single "pkgcheck results - main" report issue body on
          # each run instead of appending a comment: the action's default
          # (append-to-issue: true) left the issue body pointing at an old
          # commit (v5.0.3/171c1780) while the run was v5.0.4/ab24af91.
          append-to-issue: false

      # pkgcheck downloads pkgstats-CRAN-current.Rds from a GitHub release
      # that upstream re-uploads daily (~05:50-06:00 UTC); a run inside that
      # window dies in get_pkgstats_data() with no report ("Unable to
      # download 'pkgstats' data"; run 42567488628). Retry once after the
      # upload window instead of failing the gate on an upstream race.
      - name: Detect missing pkgcheck report
        id: report
        shell: bash
        run: |
          if [ -f .pkgcheck/summary.md ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::pkgcheck produced no report (likely upstream pkgstats download race); retrying in 10 min."
            echo "missing=true" >> "$GITHUB_OUTPUT"
            sleep 600
          fi

      # Clear the first attempt's output: a retry into a populated .pkgcheck/
      # dies with "[EEXIST] Failed to copy ... pkgstats*.html" and masks the
      # first attempt's real error.
      - name: Clear failed first attempt
        if: steps.report.outputs.missing == 'true'
        run: sudo rm -rf .pkgcheck

      - uses: ropensci-review-tools/pkgcheck-action@main
        if: steps.report.outputs.missing == 'true'
        continue-on-error: true
        with:
          ref: ""
          append-to-issue: false

      # --------------------------------------------------------------------
      # pkgcheck's own exit status reflects its rOpenSci review bar, which
      # the package cannot always pass: pkgcheck's CI sub-check races the
      # sibling workflows on every push (see RACE below). So the gate is
      # applied to pkgcheck's *report* (.pkgcheck/summary.md, written into
      # the workspace by the action), not to its exit code. Every failing
      # check in the report must be a known, justified entry; anything else
      # fails the build:
      #
      #   RACE       "Package fails continuous integration checks." —
      #              pkgcheck queries /actions/runs inside its container while
      #              the sibling R-CMD-check/test-coverage runs for the same
      #              push are still in progress (NULL conclusions -> spurious
      #              failure). Verified against the GitHub API here:
      #              tolerated as a race only when the current-SHA sibling
      #              runs actually succeeded; a genuine sibling failure (or an
      #              unverifiable state on manual dispatch) fails the build.
      #
      # Any other failing check fails the build. This is stricter than the
      # previous state: the two formerly-tolerated conditions are resolved
      # as of v5.0.5 and must not be silently re-tolerated if they recur —
      #   * PERMANENT "R CMD check found 2 warnings." (the -ffp-contract=off
      #     PKG_CXXFLAGS flag and the vendored Praat compiled-code symbols):
      #     both warnings are fixed in this release (0 warnings per
      #     cran-comments.md), so any WARNING count line is now a regression.
      #   * DEBT coverage below the 75% rOpenSci bar (tracked in
      #     docs/superpowers/plans/2026-08-21-coverage-75-percent.md): the
      #     plan is achieved — pkgcheck reports 81.2% — so "Package coverage
      #     is N% (should be at least 75%)." is now a regression.
      - name: Gate pkgcheck failures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          md=".pkgcheck/summary.md"
          if [ ! -f "$md" ]; then
            echo "::error::pkgcheck summary.md not found under .pkgcheck/ - the pkgcheck step did not produce its report. A missing report is a pipeline failure, not 'nothing to inspect'."
            exit 1
          fi
          fails=$(grep '^- :heavy_multiplication_x:' "$md" | sed 's/^- :heavy_multiplication_x: *//' | sort -u)
          if [ -z "$fails" ]; then
            echo "All pkgcheck checks passed - no failing checks in the report."
            exit 0
          fi
          # RACE is handled below. DEBT: the open rOpenSci statistical-standards
          # (srr) tags, tracked in dev/ropensci-stats-plan.md ("Status"); they
          # clear when the open standards are addressed. Do not add entries
          # here without a tracking item. Every other failing check is a
          # regression and fails.
          debt='^This package still has TODO standards|^Statistical standards should be documented in most package files'
          fail=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ "$f" = "Package fails continuous integration checks." ]; then
              # pkgcheck's CI sub-check reads the latest run per workflow
              # name while the sibling runs for this push are still in
              # progress (NULL conclusion), so it fails spuriously on every
              # push. Verify the true state for this SHA: a sibling run that
              # exists and concluded "failure" is a real failure; a run that
              # succeeded is a race; a run that does not exist (manual
              # dispatch) cannot be verified and is tolerated.
              sha="${GITHUB_SHA}"
              ok=1
              for wf in R-CMD-check test-coverage; do
                concl=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=push&head_sha=${sha}" \
                  --jq ".workflow_runs[] | select(.name == \"${wf}\") | .conclusion" | head -n 1)
                if [ -z "$concl" ]; then
                  echo "::warning::pkgcheck CI sub-check unverifiable for ${wf} on ${sha:0:7} (no run found; manual dispatch?) - tolerated."
                elif [ "$concl" != "success" ]; then
                  echo "::error::pkgcheck CI check failed AND ${wf} did not pass for ${sha:0:7} (conclusion: ${concl})."
                  ok=0
                else
                  echo "OK (race, verified): ${wf} concluded ${concl} for ${sha:0:7}."
                fi
              done
              if [ "$ok" -eq 1 ]; then
                echo "::warning::pkgcheck CI sub-check raced the sibling workflows; actual conclusions for ${sha:0:7} are success - tolerated."
              else
                fail=1
              fi
            elif printf '%s\n' "$f" | grep -Eq "$debt"; then
              echo "::warning::DEBT pkgcheck failure (open srr standards, see dev/ropensci-stats-plan.md): $f"
            else
              echo "::error::Unexpected pkgcheck failure: $f"
              fail=1
            fi
          done <<< "$fails"
          if [ "$fail" -eq 1 ]; then
            echo ""
            echo "::error::pkgcheck reported failures not on the justified list."
            echo "Fix the issue, or - if genuinely permanent - document it in"
            echo "cran-comments.md and register it in this workflow."
            exit 1
          fi
