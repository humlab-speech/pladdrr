name: pkgcheck

# This will cancel running jobs once a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

on:
  # Manually trigger the Action under Actions/pkgcheck
  workflow_dispatch:
  # Run on every push to main
  push:
    branches:
      - main

jobs:
  pkgcheck:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      # r-lib/actions/setup-r sets this for other workflows, but
      # pkgcheck-action's own docker step doesn't - without it,
      # testthat::skip_on_cran() tests are silently skipped during the
      # action's internal covr coverage run, undercounting coverage.
      NOT_CRAN: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # pkgcheck-action's docker step runs as root, but the workspace is
      # owned by the runner user, so libgit2 refuses to open it ("dubious
      # ownership") unless safe.directory is set in the container's HOME
      # (/github/home). A host-side `git config --global` doesn't reach
      # that path, so trust it from inside a container instead.
      - uses: docker://alpine/git
        with:
          args: config --global --add safe.directory /github/workspace
      # Non-blocking: pkgcheck enforces rOpenSci review-level bars (e.g. any
      # R CMD check WARNING fails it), and two of ours are permanent per
      # cran-comments.md (-ffp-contract=off for bit-exact Praat parity;
      # justified vendored stderr/stdout/_exit symbols) - not CRAN
      # blockers, so this shouldn't block CI/merges.
      - uses: ropensci-review-tools/pkgcheck-action@main
        continue-on-error: true
        with:
          ref: ""
