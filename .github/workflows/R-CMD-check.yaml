# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}
          - {os: macos-latest,    r: 'release'}
          - {os: windows-latest,  r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # ubuntu-latest runners default to a non-UTF-8 C locale, which breaks
      # vignette rebuilding on Rmd source containing IPA/Unicode characters
      # ("invalid multibyte string"). Force UTF-8 so knitr/rmarkdown can
      # read the vignette source correctly.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgsl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gsl

      # src/Makevars.win links -lgsl -lgslcblas from the Rtools UCRT toolchain.
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rtools = Get-ChildItem C:\ -Filter 'rtools*' -Directory |
                    Sort-Object Name | Select-Object -Last 1
          if (-not $rtools) { throw 'No Rtools installation found on C:\' }
          & "$($rtools.FullName)\usr\bin\pacman.exe" -Sy --noconfirm mingw-w64-ucrt-x86_64-gsl

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::Rcpp
            any::RcppXsimd
            any::R6
            any::rlang
            any::data.table
            any::ggplot2
            any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          # error-on: "error" not the r-lib default "warning" — this package
          # vendors Praat C++ and deliberately sets -ffp-contract=off for
          # bit-exact DSP output, both of which are permanent, CRAN-documented
          # WARNINGs (see cran-comments.md), not regressions to gate CI on.
          # The step below re-imposes the gate for every *other* warning, so
          # that "error-on: error" cannot silently absorb a new one.
          error-on: '"error"'

      # The four WARNINGs below are documented and justified in cran-comments.md
      # and are inherent to vendoring Praat. Any WARNING outside that set is a
      # regression and fails the build.
      - name: Fail on unexpected R CMD check WARNINGs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log=$(find check -name 00check.log 2>/dev/null | head -n 1 || true)
          if [ -z "$log" ]; then
            echo "No 00check.log found; nothing to inspect."
            exit 0
          fi

          # Check names whose WARNING status is known, justified and permanent.
          allowed='checking compiled code|checking compilation flags used|checking compilation flags in Makevars|checking whether package .* can be installed|checking S3 generic/method consistency'

          unexpected=$(grep -E '^\* checking .*\.\.\. WARNING' "$log" | grep -Ev "$allowed" || true)

          echo "--- all WARNINGs reported ---"
          grep -E '^\* checking .*\.\.\. WARNING' "$log" || echo "(none)"

          if [ -n "$unexpected" ]; then
            echo
            echo "::error::R CMD check reported WARNINGs that are not on the justified list:"
            echo "$unexpected"
            echo
            echo "Either fix the warning, or — if it is genuinely permanent — document it"
            echo "in cran-comments.md and add its check name to the allowlist in this workflow."
            exit 1
          fi
          echo "All reported WARNINGs are on the justified list."
