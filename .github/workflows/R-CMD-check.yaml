# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}
          - {os: macos-latest,    r: 'release'}
          - {os: windows-latest,  r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # ubuntu-latest runners default to a non-UTF-8 C locale, which breaks
      # vignette rebuilding on Rmd source containing IPA/Unicode characters
      # ("invalid multibyte string"). Force UTF-8 so knitr/rmarkdown can
      # read the vignette source correctly.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-pandoc@v2.12.1

      - uses: r-lib/actions/setup-r@v2.12.1
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgsl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gsl

      # Capture Windows Error Reporting minidumps for the MSVC silent aborts in
      # vendored Praat DSP paths (see tests/testthat/helper-windows-crash-probe.R).
      # Uploaded as an artifact so the crash site can be diagnosed.
      - name: Enable Windows Error Reporting local dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d "C:\crashdumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpCount /t REG_DWORD /d 10 /f
          New-Item -ItemType Directory -Force -Path C:\crashdumps | Out-Null

      - uses: r-lib/actions/setup-r-dependencies@v2.12.1

      - uses: r-lib/actions/setup-r-dependencies@v2.12.1
        with:
          extra-packages: |
            any::rcmdcheck
            any::Rcpp
            any::RcppXsimd
            any::R6
            any::rlang
            any::data.table
            any::ggplot2
            any::testthat
          needs: check

      - uses: r-lib/actions/check-r-package@v2.12.1
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual")'
          # error-on: "error" not the r-lib default "warning" — this package
          # vendors Praat C++ and deliberately sets -ffp-contract=off for
          # bit-exact DSP output, both of which are permanent, CRAN-documented
          # WARNINGs (see cran-comments.md), not regressions to gate CI on.
          # The step below re-imposes the gate for every *other* warning, so
          # that "error-on: error" cannot silently absorb a new one.
          error-on: '"error"'

      # R CMD check WARNINGs are gated content-exactly, not by check name:
      # every WARNING section must match a known, justified, permanent entry
      # (cran-comments.md). A new check WARNING -- or drift inside a justified
      # one (e.g. a *second* non-portable flag beside -ffp-contract=off, or a
      # new prohibited symbol in the compiled code) -- fails the build. The
      # error-on: "error" above catches new errors; this step catches warning
      # regressions that a check-name allowlist would silently absorb.
      - name: Fail on unexpected R CMD check WARNINGs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          log=$(find check -name 00check.log 2>/dev/null | head -n 1 || true)
          if [ -z "$log" ]; then
            echo "No 00check.log found; nothing to inspect."
            exit 0
          fi

          # Split the log into per-check sections via regex record separator:
          # each record's first line is the check name (minus the
          # '* checking ' prefix), the remaining lines are its body.
          # (A plain line-based split cannot work: section bodies contain
          # embedded newlines, so name|body records are multi-line.)
          # CRLF logs (win-builder) are handled by stripping \r per record.

          # Check names whose WARNING status is known, justified and permanent
          # (cran-comments.md). Any other check WARNING is a regression.
          allowed_names='^(compiled code|compilation flags in Makevars|whether package .* can be installed|S3 generic/method consistency|use of S3 registration|compilation flags used) \.\.\. WARNING$'

          fail=0

          # 1. Unexpected check-name WARNINGs.
          unknown=$(awk 'BEGIN { RS = "\n\\* checking " }
            { gsub(/\r/, "", $0); n = split($0, l, "\n"); if (l[1] ~ / WARNING$/) print l[1] }
          ' "$log" | grep -Ev "$allowed_names" || true)
          if [ -n "$unknown" ]; then
            echo "::error::R CMD check reported WARNINGs from unexpected checks:"
            echo "$unknown"
            fail=1
          fi

          # 2. Content drift inside the content-stable justified WARNINGs.
          #    Makevars: the ONLY justified flag is -ffp-contract=off (required
          #    for bit-exact Praat parity; GCC implements no FP_CONTRACT pragma).
          #    Any other flag line (e.g. -march=native, -O3, -flto) fails.
          #    compiled code: only the vendored Praat stderr/stdout/_exit
          #    symbols from melder_console.o and praat.o are justified; any
          #    new symbol or object fails.
          bad=$(awk 'BEGIN { RS = "\n\\* checking " }
            {
              gsub(/\r/, "", $0)
              n = split($0, lines, "\n")
              name = lines[1]
              if (name ~ /^compilation flags in Makevars \.\.\. WARNING$/) {
                for (i = 2; i <= n; i++) {
                  # Only -ffp-contract=off is justified. R-devel also emits
                  # informational advisories about the configure/Makevars.in
                  # layout (not flags); those are allowed, anything else fails.
                  if (lines[i] !~ /^Non-portable flags in variable .PKG_CXXFLAGS.:$/ &&
                      lines[i] !~ /^  -ffp-contract=off$/ &&
                      lines[i] !~ /^Package has both .src\/Makevars\.in. and .src\/Makevars..$/ &&
                      lines[i] !~ /^Installation with --no-configure. is unlikely to work\./ &&
                      lines[i] !~ /^.src\/Makevars. to be used on Windows, rename it to .src\/Makevars\.win.$/ &&
                      lines[i] !~ /^$/) print "Makevars: " lines[i]
                }
              } else if (name ~ /^compiled code \.\.\. WARNING$/) {
                for (i = 2; i <= n; i++) {
                  line = lines[i]
                  if (line ~ /^  Found / && line !~ /possibly from .(stderr|stdout|exit). \(C\)(, .stop. \(Fortran\))?$/) print "compiled code: " line
                  if (line ~ /praat\.github\.io\// && line !~ /praat\.github\.io\/(melder\/melder_console|sys\/praat)\.o/) print "compiled code: " line
                }
              }
            }
          ' "$log")
          if [ -n "$bad" ]; then
            echo "::error::Justified WARNING sections drifted from their allowed content:"
            echo "$bad"
            fail=1
          fi

          echo "--- all WARNINGs reported ---"
          awk 'BEGIN { RS = "\n\\* checking " }
            { gsub(/\r/, "", $0); n = split($0, l, "\n"); if (l[1] ~ / WARNING$/) print "* checking " l[1] }
          ' "$log" || echo "(none)"

          if [ "$fail" -eq 1 ]; then
            echo
            echo "::error::R CMD check WARNINGs are not all on the justified list."
            echo "Fix the warning, or -- if genuinely permanent -- document it in"
            echo "cran-comments.md and extend the exact-content registry in this workflow."
            exit 1
          fi
          echo "All reported WARNINGs are on the justified list."

      # Upload macOS crash reports (if any) for diagnosis of intermittent
      # test crashes (Trace/BPT trap observed on macOS CI); non-blocking.
      - name: Upload macOS crash reports
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: macos-crashreports-${{ matrix.config.r }}
          path: ~/Library/Logs/DiagnosticReports/*
